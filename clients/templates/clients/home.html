{% extends 'clients/base.html' %}

{% block content %}
    <div class="row">
      <div class="col-sm-6 mb-3 mb-sm-0">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Список рассылок</h5>
            <p class="card-text">Посмотреть все рассылки</p>
            <a href="{% url 'mailings:campaign_list' %}" class="btn btn-primary">Перейти</a>
          </div>
        </div>
      </div>
      <div class="col-sm-6">
        <div class="card">
          <div class="card-body">

            <a href="{% url 'mailings:message_list' %}" class="btn btn-primary">Перейти</a>
          </div>
        </div>
      </div>
    </div>
    <div class="margin__top col-sm-5">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Список клиентов</h5>
            <p class="card-text">Посмотреть всех клиентов</p>
            <a href="{% url 'clients:clients_list' %}" class="btn btn-primary">Перейти</a>
